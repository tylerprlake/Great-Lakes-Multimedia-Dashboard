name: Build Water Phosphorus Summary

on:
  workflow_dispatch:
  schedule:
    # Runs after the main Monday 02:00 UTC catalogue fetch workflow.
    - cron: "30 3 * * 1"

concurrency:
  group: build-water-phosphorus-summary
  cancel-in-progress: false

jobs:
  build-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build phosphorus seasonal dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/water/derived

          python3 <<'PY'
          import csv
          import re
          from collections import Counter
          from datetime import datetime
          from pathlib import Path

          root = Path('data/water')
          output = root / 'derived' / 'phosphorus_seasonal.csv'
          diagnostics = root / 'derived' / 'phosphorus_parameter_matches.csv'

          # Only lake/year partitions are scanned. Sites and prior derived files are excluded.
          sources = sorted(
              path for path in root.glob('*/*.csv')
              if path.parent.name != 'derived'
          )
          if not sources:
              raise RuntimeError('No lake/year CSV partitions found under data/water/<lake>/<year>.csv')

          def clean(value):
              value = str(value or '').upper().replace('µ', 'U').replace('μ', 'U')
              return re.sub(r'[^A-Z0-9]+', ' ', value).strip()

          def classify(row):
              full = clean(row.get('FULL_NAME'))
              abbr = clean(row.get('ABBREV'))
              code = clean(row.get('CODE'))
              combined = f'{full} {abbr}'

              # Soluble reactive phosphorus is tested first so it cannot be
              # accidentally captured by a broader phosphorus rule.
              srp_phrases = (
                  'PHOSPHORUS SOLUBLE REACTIVE',
                  'SOLUBLE REACTIVE PHOSPHORUS',
                  'REACTIVE SOLUBLE PHOSPHORUS',
                  'SOLUBLE REACTIVE P',
              )
              if any(phrase in combined for phrase in srp_phrases) or abbr in {'SRP', 'P SRP'}:
                  return 'Phosphorus, soluble reactive'

              total_phrases = (
                  'TOTAL PHOSPHORUS',
                  'PHOSPHORUS TOTAL',
                  'TOTAL P',
              )
              excluded_forms = ('DISSOLVED', 'SOLUBLE', 'PARTICULATE', 'SUSPENDED')
              is_total = any(phrase in combined for phrase in total_phrases) or abbr in {'TP', 'T P', 'P TOT', 'PTOT'}
              if is_total and not any(term in full for term in excluded_forms):
                  return 'Total phosphorus'
              return None

          def to_mg_l(value, unit):
              try:
                  numeric = float(value)
              except (TypeError, ValueError):
                  return None
              if numeric < 0:
                  return None

              unit_clean = clean(unit).replace('PER', ' ')
              compact = unit_clean.replace(' ', '')
              if compact in {'MG/L', 'MGP/L', 'MGL', 'MGPL'}:
                  return numeric
              if compact in {'UG/L', 'UGP/L', 'MCG/L', 'UGL', 'UGPL', 'MCGL'}:
                  return numeric / 1000.0
              if compact in {'NG/L', 'NGP/L', 'NGL', 'NGPL'}:
                  return numeric / 1_000_000.0
              if compact in {'MG/M3', 'MGP/M3', 'MGM3', 'MGPM3'}:
                  return numeric / 1000.0
              return None

          rows = []
          matched = Counter()
          skipped_units = Counter()
          scanned = 0

          for source in sources:
              with source.open('r', encoding='utf-8-sig', newline='') as stream:
                  reader = csv.DictReader(stream)
                  required = {'WATER_BODY', 'PSN', 'STN_DATE', 'VALUE', 'UNITS'}
                  missing = required.difference(reader.fieldnames or [])
                  if missing:
                      raise RuntimeError(f'{source} is missing required columns: {sorted(missing)}')

                  for row in reader:
                      scanned += 1
                      parameter_class = classify(row)
                      if not parameter_class:
                          continue

                      value_mg_l = to_mg_l(row.get('VALUE'), row.get('UNITS'))
                      match_key = (
                          parameter_class,
                          row.get('CODE', ''),
                          row.get('ABBREV', ''),
                          row.get('FULL_NAME', ''),
                          row.get('UNITS', '')
                      )
                      matched[match_key] += 1
                      if value_mg_l is None:
                          skipped_units[(parameter_class, row.get('UNITS', ''))] += 1
                          continue

                      date_text = str(row.get('STN_DATE') or '').strip()
                      try:
                          sample_date = datetime.fromisoformat(date_text[:10])
                      except ValueError:
                          continue

                      cutoff = (6, 15)
                      season = 'Spring' if (sample_date.month, sample_date.day) < cutoff else 'Summer'
                      rows.append({
                          'WATER_BODY': row.get('WATER_BODY', '').strip(),
                          'PSN': row.get('PSN', '').strip(),
                          'STN_DATE': date_text,
                          'YEAR': sample_date.year,
                          'SEASON': season,
                          'PARAMETER_CLASS': parameter_class,
                          'CODE': row.get('CODE', '').strip(),
                          'ABBREV': row.get('ABBREV', '').strip(),
                          'FULL_NAME': row.get('FULL_NAME', '').strip(),
                          'VALUE_REPORTED': row.get('VALUE', '').strip(),
                          'UNITS_REPORTED': row.get('UNITS', '').strip(),
                          'VALUE_MG_L': format(value_mg_l, '.12g'),
                          'FLAG': row.get('FLAG', '').strip(),
                          'DETECTION': row.get('DETECTION', '').strip(),
                          'DEPTH_FROM': row.get('DEPTH_FROM', '').strip(),
                          'DEPTH_TO': row.get('DEPTH_TO', '').strip(),
                          'LATITUDE_DD': row.get('LATITUDE_DD', '').strip(),
                          'LONGITUDE_DD': row.get('LONGITUDE_DD', '').strip(),
                      })

          rows.sort(key=lambda row: (
              row['WATER_BODY'], int(row['YEAR']), row['SEASON'],
              row['PARAMETER_CLASS'], row['PSN'], row['STN_DATE']
          ))

          fields = [
              'WATER_BODY', 'PSN', 'STN_DATE', 'YEAR', 'SEASON',
              'PARAMETER_CLASS', 'CODE', 'ABBREV', 'FULL_NAME',
              'VALUE_REPORTED', 'UNITS_REPORTED', 'VALUE_MG_L',
              'FLAG', 'DETECTION', 'DEPTH_FROM', 'DEPTH_TO',
              'LATITUDE_DD', 'LONGITUDE_DD'
          ]
          with output.open('w', encoding='utf-8', newline='') as stream:
              writer = csv.DictWriter(stream, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)

          diagnostic_fields = [
              'PARAMETER_CLASS', 'CODE', 'ABBREV', 'FULL_NAME',
              'UNITS_REPORTED', 'MATCHED_RECORDS', 'CONVERTED_RECORDS',
              'SKIPPED_UNSUPPORTED_OR_INVALID'
          ]
          converted_counts = Counter(
              (row['PARAMETER_CLASS'], row['CODE'], row['ABBREV'], row['FULL_NAME'], row['UNITS_REPORTED'])
              for row in rows
          )
          with diagnostics.open('w', encoding='utf-8', newline='') as stream:
              writer = csv.DictWriter(stream, fieldnames=diagnostic_fields)
              writer.writeheader()
              for key, count in sorted(matched.items()):
                  parameter_class, code, abbrev, full_name, unit = key
                  converted = converted_counts[key]
                  writer.writerow({
                      'PARAMETER_CLASS': parameter_class,
                      'CODE': code,
                      'ABBREV': abbrev,
                      'FULL_NAME': full_name,
                      'UNITS_REPORTED': unit,
                      'MATCHED_RECORDS': count,
                      'CONVERTED_RECORDS': converted,
                      'SKIPPED_UNSUPPORTED_OR_INVALID': count - converted,
                  })

          if not rows:
              raise RuntimeError(
                  'No convertible phosphorus records were generated. '
                  'Inspect source FULL_NAME, ABBREV, CODE, and UNITS values and update the classifier.'
              )

          class_counts = Counter(row['PARAMETER_CLASS'] for row in rows)
          season_counts = Counter(row['SEASON'] for row in rows)
          print(f'Scanned {scanned:,} source records from {len(sources)} partitions')
          print(f'Wrote {len(rows):,} phosphorus records to {output}')
          print('Parameters:', dict(class_counts))
          print('Seasons:', dict(season_counts))
          if skipped_units:
              print('Skipped units/invalid values:', dict(skipped_units))
          PY

      - name: Validate derived files
        shell: bash
        run: |
          set -euo pipefail
          test -s data/water/derived/phosphorus_seasonal.csv
          test -s data/water/derived/phosphorus_parameter_matches.csv
          head -n 5 data/water/derived/phosphorus_parameter_matches.csv
          wc -l data/water/derived/phosphorus_seasonal.csv
          if [ "$(wc -c < data/water/derived/phosphorus_seasonal.csv)" -ge $((50 * 1024 * 1024)) ]; then
            echo "ERROR: phosphorus_seasonal.csv is 50 MiB or larger. Aggregate before committing."
            exit 1
          fi

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/water/derived/
          if git diff --cached --quiet; then
            echo "No phosphorus summary changes to commit."
            exit 0
          fi
          git commit -m "Update seasonal water phosphorus summary - $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin main
