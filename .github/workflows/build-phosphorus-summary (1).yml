name: Build Water Phosphorus Summary

on:
  workflow_dispatch:
  schedule:
    # Runs after the main Monday 02:00 UTC catalogue-fetch workflow.
    - cron: "30 3 * * 1"

concurrency:
  group: build-water-phosphorus-summary
  cancel-in-progress: false

jobs:
  build-summary:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build phosphorus seasonal dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/water/derived

          python3 <<'PY'
          import csv
          import re
          from collections import Counter
          from datetime import datetime
          from pathlib import Path

          root = Path('data/water')
          output = root / 'derived' / 'phosphorus_seasonal.csv'
          diagnostics = root / 'derived' / 'phosphorus_parameter_matches.csv'

          # Known non-phosphorus parameters that can otherwise be caught by
          # broad text such as "TOTAL P".
          EXCLUDED_CODES = {
              '981',   # Total PCBs
              '2270',  # Total PCBs
              '3763',  # Total dioxins
              '3767',  # Total furans
          }

          # Scan only lake/year partitions. Exclude the sites file and any
          # files previously generated under data/water/derived.
          sources = sorted(
              path for path in root.glob('*/*.csv')
              if path.parent.name != 'derived'
          )

          if not sources:
              raise RuntimeError(
                  'No lake/year CSV partitions were found under '
                  'data/water/<lake>/<year>.csv'
              )

          def clean(value):
              """Normalize source labels for conservative text matching."""
              value = str(value or '').upper()
              value = value.replace('µ', 'U').replace('μ', 'U')
              return re.sub(r'[^A-Z0-9]+', ' ', value).strip()

          def classify(row):
              """Classify only the two phosphorus parameters used by the dashboard."""
              full = clean(row.get('FULL_NAME'))
              abbrev = clean(row.get('ABBREV'))
              code = str(row.get('CODE') or '').strip()
              combined = f'{full} {abbrev}'

              # Explicitly reject known non-phosphorus totals.
              if code in EXCLUDED_CODES:
                  return None

              # Soluble reactive phosphorus is tested first so it cannot be
              # captured by a broader total-phosphorus rule.
              srp_phrases = (
                  'PHOSPHORUS SOLUBLE REACTIVE',
                  'SOLUBLE REACTIVE PHOSPHORUS',
                  'REACTIVE SOLUBLE PHOSPHORUS',
                  'SOLUBLE REACTIVE P',
              )

              if (
                  any(phrase in combined for phrase in srp_phrases)
                  or abbrev in {'SRP', 'P SRP'}
              ):
                  return 'Phosphorus, soluble reactive'

              # Word boundaries prevent TOTAL P from matching TOTAL PCBS.
              total_name_match = bool(
                  re.search(
                      r'\b(?:TOTAL\s+PHOSPHORUS|PHOSPHORUS\s+TOTAL|TOTAL\s+P)\b',
                      combined,
                  )
              )

              total_abbreviation_match = abbrev in {
                  'TP',
                  'T P',
                  'P TOT',
                  'PTOT',
              }

              # These are distinct phosphorus fractions and are not treated as
              # total phosphorus by this summary.
              excluded_forms = (
                  'DISSOLVED',
                  'SOLUBLE',
                  'PARTICULATE',
                  'SUSPENDED',
              )

              if (
                  (total_name_match or total_abbreviation_match)
                  and not any(term in full for term in excluded_forms)
              ):
                  return 'Total phosphorus'

              return None

          def to_mg_l(value, unit):
              """Convert supported concentration units to mg/L."""
              try:
                  numeric = float(value)
              except (TypeError, ValueError):
                  return None

              # Exclude negative missing-value or invalid-result sentinels.
              if numeric < 0:
                  return None

              unit_clean = clean(unit).replace('PER', ' ')
              compact = unit_clean.replace(' ', '')

              if compact in {'MG/L', 'MGP/L', 'MGL', 'MGPL'}:
                  return numeric

              if compact in {
                  'UG/L',
                  'UGP/L',
                  'MCG/L',
                  'UGL',
                  'UGPL',
                  'MCGL',
              }:
                  return numeric / 1000.0

              if compact in {'NG/L', 'NGP/L', 'NGL', 'NGPL'}:
                  return numeric / 1_000_000.0

              if compact in {'MG/M3', 'MGP/M3', 'MGM3', 'MGPM3'}:
                  return numeric / 1000.0

              return None

          rows = []
          matched = Counter()
          converted_counts = Counter()
          skipped_units_or_values = Counter()
          excluded_code_counts = Counter()
          scanned = 0

          for source in sources:
              with source.open(
                  'r',
                  encoding='utf-8-sig',
                  newline='',
              ) as stream:
                  reader = csv.DictReader(stream)

                  required = {
                      'WATER_BODY',
                      'PSN',
                      'STN_DATE',
                      'VALUE',
                      'UNITS',
                  }
                  missing = required.difference(reader.fieldnames or [])

                  if missing:
                      raise RuntimeError(
                          f'{source} is missing required columns: '
                          f'{sorted(missing)}'
                      )

                  for row in reader:
                      scanned += 1
                      source_code = str(row.get('CODE') or '').strip()

                      if source_code in EXCLUDED_CODES:
                          excluded_code_counts[source_code] += 1
                          continue

                      parameter_class = classify(row)
                      if not parameter_class:
                          continue

                      match_key = (
                          parameter_class,
                          source_code,
                          row.get('ABBREV', ''),
                          row.get('FULL_NAME', ''),
                          row.get('UNITS', ''),
                      )
                      matched[match_key] += 1

                      value_mg_l = to_mg_l(
                          row.get('VALUE'),
                          row.get('UNITS'),
                      )

                      if value_mg_l is None:
                          skipped_units_or_values[
                              (parameter_class, row.get('UNITS', ''))
                          ] += 1
                          continue

                      date_text = str(row.get('STN_DATE') or '').strip()

                      try:
                          sample_date = datetime.fromisoformat(date_text[:10])
                      except ValueError:
                          continue

                      # Spring is strictly before June 15.
                      # June 15 and later are classified as Summer.
                      season = (
                          'Spring'
                          if (sample_date.month, sample_date.day) < (6, 15)
                          else 'Summer'
                      )

                      rows.append({
                          'WATER_BODY': row.get('WATER_BODY', '').strip(),
                          'PSN': row.get('PSN', '').strip(),
                          'STN_DATE': date_text,
                          'YEAR': sample_date.year,
                          'SEASON': season,
                          'PARAMETER_CLASS': parameter_class,
                          'CODE': source_code,
                          'ABBREV': row.get('ABBREV', '').strip(),
                          'FULL_NAME': row.get('FULL_NAME', '').strip(),
                          'VALUE_REPORTED': row.get('VALUE', '').strip(),
                          'UNITS_REPORTED': row.get('UNITS', '').strip(),
                          'VALUE_MG_L': format(value_mg_l, '.12g'),
                          'FLAG': row.get('FLAG', '').strip(),
                          'DETECTION': row.get('DETECTION', '').strip(),
                          'DEPTH_FROM': row.get('DEPTH_FROM', '').strip(),
                          'DEPTH_TO': row.get('DEPTH_TO', '').strip(),
                          'LATITUDE_DD': row.get('LATITUDE_DD', '').strip(),
                          'LONGITUDE_DD': row.get('LONGITUDE_DD', '').strip(),
                      })

                      converted_counts[match_key] += 1

          rows.sort(
              key=lambda row: (
                  row['WATER_BODY'],
                  int(row['YEAR']),
                  row['SEASON'],
                  row['PARAMETER_CLASS'],
                  row['PSN'],
                  row['STN_DATE'],
              )
          )

          output_fields = [
              'WATER_BODY',
              'PSN',
              'STN_DATE',
              'YEAR',
              'SEASON',
              'PARAMETER_CLASS',
              'CODE',
              'ABBREV',
              'FULL_NAME',
              'VALUE_REPORTED',
              'UNITS_REPORTED',
              'VALUE_MG_L',
              'FLAG',
              'DETECTION',
              'DEPTH_FROM',
              'DEPTH_TO',
              'LATITUDE_DD',
              'LONGITUDE_DD',
          ]

          with output.open(
              'w',
              encoding='utf-8',
              newline='',
          ) as stream:
              writer = csv.DictWriter(
                  stream,
                  fieldnames=output_fields,
              )
              writer.writeheader()
              writer.writerows(rows)

          diagnostic_fields = [
              'PARAMETER_CLASS',
              'CODE',
              'ABBREV',
              'FULL_NAME',
              'UNITS_REPORTED',
              'MATCHED_RECORDS',
              'CONVERTED_RECORDS',
              'SKIPPED_UNSUPPORTED_OR_INVALID',
          ]

          with diagnostics.open(
              'w',
              encoding='utf-8',
              newline='',
          ) as stream:
              writer = csv.DictWriter(
                  stream,
                  fieldnames=diagnostic_fields,
              )
              writer.writeheader()

              for key, matched_count in sorted(matched.items()):
                  (
                      parameter_class,
                      code,
                      abbrev,
                      full_name,
                      unit,
                  ) = key

                  converted_count = converted_counts[key]

                  writer.writerow({
                      'PARAMETER_CLASS': parameter_class,
                      'CODE': code,
                      'ABBREV': abbrev,
                      'FULL_NAME': full_name,
                      'UNITS_REPORTED': unit,
                      'MATCHED_RECORDS': matched_count,
                      'CONVERTED_RECORDS': converted_count,
                      'SKIPPED_UNSUPPORTED_OR_INVALID': (
                          matched_count - converted_count
                      ),
                  })

          if not rows:
              raise RuntimeError(
                  'No convertible phosphorus records were generated. '
                  'Inspect FULL_NAME, ABBREV, CODE, and UNITS in the source '
                  'partitions and update the classifier if necessary.'
              )

          class_counts = Counter(
              row['PARAMETER_CLASS'] for row in rows
          )
          season_counts = Counter(row['SEASON'] for row in rows)

          print(
              f'Scanned {scanned:,} source records '
              f'from {len(sources)} partitions'
          )
          print(
              f'Wrote {len(rows):,} phosphorus records to {output}'
          )
          print('Parameters:', dict(class_counts))
          print('Seasons:', dict(season_counts))
          print(
              'Explicitly excluded codes:',
              dict(excluded_code_counts),
          )

          if skipped_units_or_values:
              print(
                  'Skipped unsupported units or invalid values:',
                  dict(skipped_units_or_values),
              )
          PY

      - name: Validate derived files
        shell: bash
        run: |
          set -euo pipefail

          test -s data/water/derived/phosphorus_seasonal.csv
          test -s data/water/derived/phosphorus_parameter_matches.csv

          echo "Parameter-match preview:"
          head -n 10 data/water/derived/phosphorus_parameter_matches.csv

          echo "Derived phosphorus row count:"
          wc -l data/water/derived/phosphorus_seasonal.csv

          # These known non-phosphorus codes must not occur in either output.
          if grep -E '(^|,)(981|2270|3763|3767)(,|$)' \
            data/water/derived/phosphorus_seasonal.csv \
            data/water/derived/phosphorus_parameter_matches.csv; then
            echo "ERROR: A known non-phosphorus code remains in a derived file."
            exit 1
          fi

          # Keep the summary within GitHub's recommended regular-file size.
          if [ "$(wc -c < data/water/derived/phosphorus_seasonal.csv)" \
            -ge $((50 * 1024 * 1024)) ]; then
            echo "ERROR: phosphorus_seasonal.csv is 50 MiB or larger."
            echo "Aggregate the derived dataset before committing it."
            exit 1
          fi

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/water/derived/

          if git diff --cached --quiet; then
            echo "No phosphorus summary changes to commit."
            exit 0
          fi

          git commit -m \
            "Update seasonal water phosphorus summary - $(date -u +'%Y-%m-%d')"

          git pull --rebase origin main
          git push origin main
